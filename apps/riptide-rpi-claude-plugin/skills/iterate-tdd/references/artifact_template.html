<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{Artifact title}</title>
<!--
  STYLESHEET-ONLY TEMPLATE for TDD HTML artifacts.

  These artifacts render INSIDE this application's artifact viewer (an IDE-like
  environment), so they should match THIS app's visual language - not the visual
  language of whatever codebase the TDD is about.

  How to use:
  - Keep this <style> block as-is so typography, borders, and badges stay consistent.
  - Put your content inside <body>. There is no required structure - use plain
    prose (<h1>-<h4>, <p>, <ul>), <pre>/<code> for code, and the small set of
    utility classes below (.card, .badge*, .stat*, .ba) when they help.
  - Square corners, the poimandres terminal palette, system-ui sans for prose, and
    IBM Plex Mono for code/chrome are intentional. Don't introduce other fonts,
    rounded corners, or off-palette colors.
-->
<style>
  @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap");

  :root {
    --bg: #1b1e28; --bg-deep: #171922; --bg-alt: #303340;
    --border: #303340; --guide: #303340;
    --text: #a6accd; --bright: #ffffff;
    --muted: rgba(166, 172, 205, 0.55);
    --accent: #add7ff; --accent-dim: rgba(173, 215, 255, 0.3);
    --mint: #5de4c7; --yellow: #fffac2; --blue: #89ddff;
    --rose: #d0679d; --pink: #f087bd;
    --mono: "IBM Plex Mono", Consolas, Monaco, "Courier New", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; border-radius: 0; }
  ::selection { background: #717cb425; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    margin: 0; padding: 26px 22px 120px; font-size: 15px; font-weight: 300;
    line-height: 1.7; letter-spacing: 0.03em; -webkit-font-smoothing: antialiased;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  main, .wrap { max-width: 1120px; margin: 0 auto; }

  /* headings - accent color, tight tracking, like the artifact viewer */
  h1, h2, h3, h4 { color: var(--accent); font-weight: 600; line-height: 1.3; margin: 1.6em 0 0.5em; }
  h1 { font-size: 24px; letter-spacing: -0.02em; margin-top: 0; }
  h2 { font-size: 19px; letter-spacing: -0.02em; }
  h3 { font-size: 16px; letter-spacing: -0.01em; }
  h4 { font-size: 13px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  /* prose */
  p { margin: 0 0 1em; max-width: 84ch; line-height: 1.9; }
  strong, b { color: var(--bright); font-weight: 600; }
  em { color: var(--text); font-style: italic; }
  a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; transition: color 0.15s ease; }
  a:hover { color: var(--blue); }
  ul, ol { margin: 0.5em 0 1em; padding-left: 1.6em; max-width: 84ch; }
  li { margin: 0; line-height: 1.8; }
  li + li { margin-top: 0.35em; }
  li::marker { color: var(--muted); }
  hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

  /* code + preformatted */
  code { font-family: var(--mono); font-size: 0.875em; background: var(--bg-alt); padding: 0.1em 0.35em 0; letter-spacing: normal; }
  pre {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.7; background: var(--bg-deep);
    border: 1px solid var(--border); padding: 12px 14px; overflow-x: auto; color: var(--text);
    margin: 0.8em 0; white-space: pre; tab-size: 2; letter-spacing: normal;
  }
  pre code { background: none; padding: 0; font-size: inherit; }
  /* optional manual syntax spans inside <pre> */
  pre .k { color: var(--mint); } pre .s { color: var(--blue); }
  pre .c { color: rgba(166,172,205,0.5); font-style: italic; } pre .fn { color: var(--accent); }

  blockquote { margin: 1em 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--accent-dim); color: var(--muted); }

  /* tables */
  table { border-collapse: collapse; margin: 1em 0; font-size: 13px; width: 100%; }
  th, td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; vertical-align: top; }
  th { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }

  /* card - a bordered container for a self-contained block */
  .card { border: 1px solid var(--border); background: var(--bg-deep); padding: 20px 24px; margin: 1em 0; }

  /* badges - 1px border + color/10 fill; solid fill marks terminal states */
  .badge { display: inline-block; font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: 0.08em; padding: 2px 6px; text-transform: uppercase; border: 1px solid; }
  .b-accent   { color: var(--accent); border-color: var(--accent-dim);     background: rgba(173,215,255,0.1); }
  .b-new      { color: var(--mint);   border-color: rgba(93,228,199,0.4);   background: rgba(93,228,199,0.1); }
  .b-modified { color: var(--blue);   border-color: rgba(137,221,255,0.4);  background: rgba(137,221,255,0.1); }
  .b-note     { color: var(--rose);   border-color: rgba(208,103,157,0.4);  background: rgba(208,103,157,0.1); }
  .b-principle{ color: var(--pink);   border-color: rgba(240,135,189,0.4);  background: rgba(240,135,189,0.1); }
  .b-kept     { color: var(--text);   border-color: var(--border);          background: rgba(166,172,205,0.08); }
  .b-removed  { color: var(--bg);     border-color: var(--rose);            background: var(--rose); }

  /* stats - mono key/value chips */
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  .stat { background: var(--bg); border: 1px solid var(--border); padding: 8px 14px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.6; }
  .stat b { display: block; font-size: 14px; font-weight: 500; color: var(--accent); text-transform: none; letter-spacing: 0; margin-bottom: 2px; }
  .stat b.ok { color: var(--mint); }

  /* before / after - side-by-side code comparison */
  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0.8em 0; }
  @media (max-width: 900px) { .ba { grid-template-columns: 1fr; } }
  .ba > div { min-width: 0; }
  .ba .label { font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; margin-bottom: 4px; text-transform: uppercase; }
  .ba .before .label { color: var(--rose); }
  .ba .after .label { color: var(--mint); }
  .ba .before pre { border-color: rgba(208,103,157,0.35); }
  .ba .after pre { border-color: rgba(93,228,199,0.35); }
  .ba pre { margin: 0; }
</style>
</head>
<body>

</body>
</html>
