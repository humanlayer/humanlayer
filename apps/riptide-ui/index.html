<!DOCTYPE html>
<html lang="en" data-theme="rose-pine">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#191724" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="HumanLayer — plan, delegate, and review work with your coding agents." />
    <title>HumanLayer</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HumanLayer" />
    <meta property="og:description" content="HumanLayer — plan, delegate, and review work with your coding agents." />
    <script>
      try {
        const storedTheme = localStorage.getItem('riptide-theme')
        const parsedTheme = storedTheme ? JSON.parse(storedTheme) : null
        if (typeof parsedTheme === 'string') document.documentElement.dataset.theme = parsedTheme
      } catch {}
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
