config:
  aws:region: us-east-1
  aws:allowedAccountIds:
    - "PLACEHOLDER_AWS_ACCOUNT_ID_PLACEHOLDER"
  pulumi:autonaming:
    pattern: ${name}-${stack}-${alphanum(6)}
  database-maintenance-function:sentryEnvironment: prod
  database-maintenance-function:sentryDsn: PLACEHOLDER_SENTRY_DSN_PLACEHOLDER
  database-maintenance-function:scheduleExpression: rate(1 day)
