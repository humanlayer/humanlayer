name: Build Riptide API ARM Container

on:
  workflow_dispatch:
  pull_request:
    paths: &riptide-api-inputs
      - apps/riptide-api/**
      - contracts/riptide-api-contract/**
      - packages/ai/**
      - packages/billing/**
      - packages/db/**
      - packages/logger/**
      - packages/schemas/**
      - packages/streams/**
      - vendor/effect-orpc/**
      - package.json
      - bun.lock
      - bunfig.toml
      - .npmrc
      - tsconfig.json
      - turbo.json
      - vitest.config.ts
      - .dockerignore
      - .github/workflows/arm-container-riptide-api.yml
  push:
    branches: [main]
    paths: *riptide-api-inputs

jobs:
  build:
    name: ARM container build (Riptide API)
    # GitHub-hosted, so fork code never runs on hardware we pay for
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/arm64 --output type=cacheonly --file apps/riptide-api/Dockerfile .
